<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo Shop Admin — synthetic fixture</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#14161f;--muted:#667085;--line:#e4e7ec;--brand:#4f46e5;--ok:#12b76a}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.fixture{background:#fff4d6;color:#7a4b00;text-align:center;font-size:13px;padding:6px;border-bottom:1px solid #f1d59a}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--card);border-bottom:1px solid var(--line)}
header b{font-size:18px}.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.primary{background:var(--brand);color:#fff}main{padding:20px;display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi small{color:var(--muted)}.kpi div{font-size:26px;font-weight:700;margin-top:4px}
table{width:100%;border-collapse:collapse}td,th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
th{color:var(--muted);font-weight:600;font-size:13px}.pill{background:#ecfdf3;color:var(--ok);border-radius:99px;padding:2px 10px;font-size:13px}
form{display:none;gap:10px}form.open{display:grid}input{padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}
</style></head><body>
<div class="fixture">DEMO FIXTURE · synthetic data · not a real store</div>
<header><b>Demo Shop Admin</b><button class="btn primary" id="add">+ Add product</button></header>
<main>
<section class="kpis"><div class="card kpi"><small>Products</small><div id="count">3</div></div><div class="card kpi"><small>Drafts</small><div>1</div></div></section>
<section class="card"><form id="form"><input id="name" placeholder="Product name"><input id="price" placeholder="Price"><button class="btn primary" id="save" type="button">Save product</button></form>
<table><thead><tr><th>Product</th><th>Price</th><th>Status</th></tr></thead><tbody id="rows">
<tr><td>Sample Mug</td><td>120.00</td><td><span class="pill">Active</span></td></tr>
<tr><td>Sample Tote</td><td>95.00</td><td><span class="pill">Active</span></td></tr>
<tr><td>Sample Notebook</td><td>60.00</td><td><span class="pill">Active</span></td></tr></tbody></table></section>
</main>
<script>
const f=document.getElementById('form');document.getElementById('add').onclick=()=>f.classList.toggle('open');
document.getElementById('save').onclick=()=>{const n=document.getElementById('name').value||'Untitled';const p=document.getElementById('price').value||'0.00';
const tr=document.createElement('tr');tr.innerHTML=`<td></td><td></td><td><span class="pill">Active</span></td>`;tr.children[0].textContent=n;tr.children[1].textContent=p;
document.getElementById('rows').prepend(tr);document.getElementById('count').textContent=document.getElementById('rows').children.length;f.classList.remove('open');};
</script></body></html>
