name: validate-skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR cancels the superseded run. Non-PR runs (push to main) get a
# unique group per run, so they are never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # Runtime cap only (queue time is not counted): the job takes a few minutes; 45 is a hang guard.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Node validator is canonical and cross-platform (also runnable on Windows).
      - name: Run skill validator
        run: node scripts/cli.mjs validate
      - name: Test ship-ticket telemetry
        run: node --test skills/ship-ticket/scripts/run-log.test.mjs
      - name: Test vapt control catalog
        run: node --test skills/vapt/controls.test.mjs
      - name: Test vapt selection fixtures
        run: node --test skills/vapt/fixtures.test.mjs
      - name: Test vapt effectiveness tools
        run: node --test skills/vapt/effectiveness.test.mjs
      # Append-only is checked against the PR base (pull_request) or the pre-push sha (push); needs fetch-depth: 0.
      - name: Test and check review-rounds ledgers
        env:
          REVIEW_ROUNDS_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node --test scripts/review-rounds.test.mjs && node scripts/review-rounds.mjs check --base "$REVIEW_ROUNDS_BASE"

  # The library CLI links (symlinks, or junctions on Windows), copies and updates skill directories,
  # so it is tested on every OS on Node 22, the supported floor. Each test runs a temp copy of the CLI
  # against a temp home directory.
  cli:
    # Runtime cap only (queue time is not counted): cli.test.mjs takes a few minutes; 45 is a hang guard.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test the library CLI
        run: node --test scripts/cli.test.mjs

  # The execution harness spawns and kills real child processes and resolves
  # Windows .cmd shims, so it is exercised on every OS on Node 22, the supported floor.
  harness:
    # Runtime cap only (queue time is not counted): Windows is the slowest cell at about 26.5 min median;
    # 60 leaves more than double that, and stops the macOS hangs that ran 71-360 min.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test ship-ticket execution harness
        run: >-
          node --test
          skills/ship-ticket/scripts/harness.test.mjs
          skills/ship-ticket/scripts/harness-host.test.mjs
          skills/ship-ticket/scripts/host-admit.test.mjs
          skills/ship-ticket/scripts/docker-lifecycle.test.mjs
          skills/ship-ticket/scripts/carrier-usage.test.mjs
          skills/ship-ticket/scripts/candidate-id.test.mjs
          skills/ship-ticket/scripts/usage.test.mjs
          skills/ship-ticket/scripts/gate.test.mjs
          skills/ship-ticket/scripts/lib/durable-io.test.mjs
          skills/ship-ticket/scripts/run-engine.test.mjs
          skills/ship-ticket/scripts/run-engine-repair.test.mjs
          skills/ship-ticket/scripts/run-engine-review3.test.mjs
          skills/ship-ticket/scripts/run-engine-review4.test.mjs
          skills/ship-ticket/scripts/run-engine-review5.test.mjs
          skills/ship-ticket/scripts/run-engine-wave0.test.mjs
          skills/ship-ticket/scripts/run-engine-units.test.mjs
          skills/ship-ticket/scripts/run-engine-unit-review.test.mjs
          skills/ship-ticket/scripts/run-engine-wave3.test.mjs
          skills/ship-ticket/scripts/run-engine-cr38.test.mjs
          skills/ship-ticket/scripts/run-engine-rebind.test.mjs
          skills/ship-ticket/scripts/run-engine-gap23.test.mjs
          skills/ship-ticket/scripts/gate-security.test.mjs
          skills/ship-ticket/scripts/engine-authority-test-kinds.test.mjs
          skills/ship-ticket/scripts/run-engine-security.test.mjs
          skills/ship-ticket/scripts/security-plan.test.mjs
          skills/ship-ticket/scripts/security-obligations.test.mjs
          skills/ship-ticket/scripts/risk-floor.test.mjs
          skills/ship-ticket/scripts/test-kinds.test.mjs
          skills/ship-ticket/scripts/skill-docs-no-optin.test.mjs
          skills/ship-ticket/scripts/engine-test-kinds.test.mjs
          skills/ship-ticket/scripts/engine-test-kinds-io.test.mjs
          skills/ship-ticket/scripts/run-engine-test-kinds.test.mjs
          skills/ship-ticket/scripts/eval.test.mjs
          skills/ship-ticket/scripts/eval-cycles.test.mjs
          skills/ship-ticket/scripts/engine-bench.test.mjs
          skills/ship-ticket/scripts/engine-accepted.test.mjs
          skills/ship-ticket/scripts/engine-dag.test.mjs
          skills/ship-ticket/scripts/brief.test.mjs
          skills/ship-ticket/scripts/brief-start-check.test.mjs
          skills/ship-ticket/scripts/brief-debate.test.mjs
          skills/ship-ticket/scripts/approval-surface-wording.test.mjs
          skills/ship-ticket/scripts/ship-ready-check.test.mjs
          skills/ship-ticket/scripts/base-drift.test.mjs
          skills/ship-ticket/scripts/review-wording.test.mjs
          skills/ship-ticket/scripts/fr4-wording.test.mjs
          skills/ship-ticket/scripts/stabilization-wording.test.mjs
          skills/ship-ticket/scripts/sprint-wording.test.mjs
          skills/ship-ticket/scripts/run-engine-record.test.mjs
          skills/ship-ticket/scripts/run-engine-policy.test.mjs
          skills/ship-ticket/scripts/engine-fixture-warmup.test.mjs
          skills/ship-ticket/scripts/launcher-sampler.test.mjs
          skills/ship-ticket/scripts/engine-runner-sealed.test.mjs
          skills/ship-ticket/scripts/wave1-metrics.test.mjs
          skills/ship-ticket/scripts/engine-explore.test.mjs
          skills/ship-ticket/scripts/engine-crash.test.mjs
          skills/ship-ticket/scripts/fast-checks.test.mjs
          skills/ship-ticket/scripts/lib/git-capability.test.mjs
          skills/ship-ticket/scripts/lib/git-exec.test.mjs
          skills/ship-ticket/scripts/ci-snapshot.test.mjs
          skills/ship-ticket/scripts/ci-classify.test.mjs
          skills/ship-ticket/scripts/lib/shape.test.mjs
          skills/ship-ticket/scripts/lib/mutation-harness.test.mjs
          skills/ship-ticket/scripts/measure/events.test.mjs
          skills/ship-ticket/scripts/lib/run-log-paths.test.mjs
          skills/ship-ticket/scripts/check-pr-scope.test.mjs
          skills/ship-ticket/scripts/engine-base.test.mjs
          skills/ship-ticket/scripts/run-engine-base.test.mjs
          skills/ship-ticket/scripts/wave.test.mjs
          skills/ship-ticket/scripts/engine-adopt.test.mjs
          skills/ship-ticket/scripts/run-engine-adopt.test.mjs
          skills/ship-ticket/scripts/engine-identity.test.mjs
          skills/ship-ticket/scripts/run-engine-identity.test.mjs
          skills/ship-ticket/scripts/run-engine-substrate.test.mjs

  # AIS-HARNESS-3 Wave 3.5 engine-contract harness beyond the matrix: the seeded CLI layer (about
  # 100 commands; ENGINE_SEEDED_SEEDS / ENGINE_SEEDED_COMMANDS widen it) and the mutation check
  # (each engine guard patched out in a temp copy must fail the property harness), then the security
  # guard mutation check (about 84 s measured). POSIX only; one test file at a time, since all of
  # them spawn many real engine and worker processes.
  engine-properties:
    runs-on: ubuntu-latest
    # Above the engine mutation test's own 30-minute ceiling (each harness run is killed after 10 minutes)
    # plus the security (about 84 s) and record (about 143 s) mutation steps: about 35 minutes of 45.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Seeded CLI layer and mutation check
        env:
          ENGINE_MUTATION: '1'
        run: >-
          node --test --test-concurrency=1
          skills/ship-ticket/scripts/engine-seeded.test.mjs
          skills/ship-ticket/scripts/engine-mutation.test.mjs
      - name: Security guard mutation check
        env:
          ENGINE_SECURITY_MUTATION: '1'
        run: >-
          node --test --test-concurrency=1
          skills/ship-ticket/scripts/engine-security-mutation.test.mjs
      - name: Test-kinds fail-closed recognition mutation check
        run: >-
          node --test --test-concurrency=1
          skills/ship-ticket/scripts/test-kinds-mutation.test.mjs
      - name: Record guard mutation check
        env:
          ENGINE_RECORD_MUTATION: '1'
        run: >-
          node --test --test-concurrency=1
          skills/ship-ticket/scripts/engine-record-mutation.test.mjs
      - name: Pinned remote base guard mutation check (S-12)
        env:
          ENGINE_BASE_MUTATION: '1'
        run: >-
          node --test --test-concurrency=1
          skills/ship-ticket/scripts/engine-base-mutation.test.mjs
      - name: Run adoption guard mutation check (S-13a)
        env:
          ENGINE_ADOPT_MUTATION: '1'
        run: >-
          node --test --test-concurrency=1
          skills/ship-ticket/scripts/engine-adopt-mutation.test.mjs
      - name: Repository identity guard mutation check (S-28a)
        env:
          ENGINE_IDENTITY_MUTATION: '1'
        run: >-
          node --test --test-concurrency=1
          skills/ship-ticket/scripts/engine-identity-mutation.test.mjs
      - name: Measurement event mutation check
        env:
          EVENTS_MUTATION: '1'
        run: node --test skills/ship-ticket/scripts/measure/events.test.mjs
