name: validate-skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Node validator is canonical and cross-platform (also runnable on Windows).
      - name: Run skill validator
        run: node scripts/cli.mjs validate
      - name: Test ship-ticket telemetry
        run: node --test skills/ship-ticket/scripts/run-log.test.mjs
      - name: Test project-audit continuity
        run: node --test skills/project-audit/scripts/check-continuity.test.mjs
      - name: Test marketing-video gates
        run: node --test skills/marketing-video/scripts/gates.test.mjs skills/marketing-video/scripts/qa.test.mjs
      - name: Test vapt control catalog
        run: node --test skills/vapt/controls.test.mjs
      - name: Test vapt selection fixtures
        run: node --test skills/vapt/fixtures.test.mjs
      - name: Test vendored security-audit validators
        run: node --test skills/security-audit/validate-findings.test.cjs skills/security-audit/validate-coverage-ledger.test.cjs

  # The execution harness spawns and kills real child processes and resolves
  # Windows .cmd shims, so it is exercised on every OS and on the minimum Node.
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test ship-ticket execution harness
        run: >-
          node --test
          skills/ship-ticket/scripts/harness.test.mjs
          skills/ship-ticket/scripts/docker-lifecycle.test.mjs
          skills/ship-ticket/scripts/carrier-usage.test.mjs
          skills/ship-ticket/scripts/candidate-id.test.mjs
          skills/ship-ticket/scripts/usage.test.mjs
          skills/ship-ticket/scripts/gate.test.mjs
          skills/ship-ticket/scripts/run-engine.test.mjs
          skills/ship-ticket/scripts/run-engine-repair.test.mjs
          skills/ship-ticket/scripts/run-engine-review3.test.mjs
          skills/ship-ticket/scripts/run-engine-review4.test.mjs
          skills/ship-ticket/scripts/run-engine-review5.test.mjs
          skills/ship-ticket/scripts/run-engine-wave0.test.mjs
          skills/ship-ticket/scripts/run-engine-units.test.mjs
          skills/ship-ticket/scripts/run-engine-unit-review.test.mjs
          skills/ship-ticket/scripts/run-engine-wave3.test.mjs
          skills/ship-ticket/scripts/run-engine-cr38.test.mjs
          skills/ship-ticket/scripts/run-engine-rebind.test.mjs
          skills/ship-ticket/scripts/run-engine-gap23.test.mjs
          skills/ship-ticket/scripts/gate-security.test.mjs
          skills/ship-ticket/scripts/run-engine-security.test.mjs
          skills/ship-ticket/scripts/security-plan.test.mjs
          skills/ship-ticket/scripts/eval.test.mjs
          skills/ship-ticket/scripts/engine-bench.test.mjs
          skills/ship-ticket/scripts/launcher-sampler.test.mjs
          skills/ship-ticket/scripts/wave1-metrics.test.mjs
          skills/ship-ticket/scripts/engine-explore.test.mjs
          skills/ship-ticket/scripts/engine-crash.test.mjs

  # AIS-HARNESS-3 Wave 3.5 engine-contract harness beyond the matrix: the seeded CLI layer (about
  # 100 commands; ENGINE_SEEDED_SEEDS / ENGINE_SEEDED_COMMANDS widen it) and the mutation check
  # (each engine guard patched out in a temp copy must fail the property harness), then the security
  # guard mutation check (about 84 s measured). POSIX only; one test file at a time, since all of
  # them spawn many real engine and worker processes.
  engine-properties:
    runs-on: ubuntu-latest
    # Above the engine mutation test's own 30-minute ceiling (each harness run is killed after 10 minutes)
    # plus the security mutation step (about 84 s): about 32 minutes of 45.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Seeded CLI layer and mutation check
        env:
          ENGINE_MUTATION: '1'
        run: >-
          node --test --test-concurrency=1
          skills/ship-ticket/scripts/engine-seeded.test.mjs
          skills/ship-ticket/scripts/engine-mutation.test.mjs
      - name: Security guard mutation check
        env:
          ENGINE_SECURITY_MUTATION: '1'
        run: >-
          node --test --test-concurrency=1
          skills/ship-ticket/scripts/engine-security-mutation.test.mjs
